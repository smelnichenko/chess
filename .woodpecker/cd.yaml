# CD: Test + Build + Push + Deploy on push to main
# Builds the chess image, pushes it to the Forgejo registry, and points test at it (update-infra: ci-deploy chess test);
# production follows by ops' task promote:run.

when:
  - branch: main
    event: push

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
      partial: false
      depth: 100
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  # ============== TEST ==============
  - name: test
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitor_chess
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_DATA_REDIS_HOST: valkey
    commands:
      # A Gradle home from a pool of three (/cache/gradle/pool/1, 2, 3), shared by every app's builds: the step takes the
      # first free one and holds a flock on it while it runs, released when its processes end however they end (exit, SIGKILL,
      # pod deleted). It never waits: Woodpecker runs two workflows at once (infra's WOODPECKER_MAX_WORKFLOWS) and each runs
      # its Gradle steps one after another, so a home is always free - the third for a cancelled build still dying in its
      # 20 s grace or an orphaned step pod. Every home taken is a fault, failed at once with its holders named. One Gradle
      # per home: Gradle's own locks are kernel locks too, but its request to a holder to release goes over loopback, which
      # no other pod shares. Never delete a home's *.lock files: a live Gradle holds them.
      - mkdir -p /cache/gradle/pool
      - 'home=""; for n in 1 2 3; do exec 9>>"/cache/gradle/pool/$n.flock"; if flock -n 9; then home=$n; break; fi; exec 9>&-; done'
      - '[ -n "$home" ] || { echo "every Gradle home in the pool is taken (three, for two workflows at once) - by: $(cat /cache/gradle/pool/*.holder 2>/dev/null | paste -sd ";")"; exit 1; }'
      - export GRADLE_USER_HOME=/cache/gradle/pool/$home
      - mkdir -p "$GRADLE_USER_HOME"
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > "/cache/gradle/pool/$home.holder"'
      - ./gradlew clean check --no-daemon
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        resources:
          requests: { memory: 2Gi }
          limits: { memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  - name: sonar
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    commands:
      # A Gradle home from a pool of three (/cache/gradle/pool/1, 2, 3), shared by every app's builds: the step takes the
      # first free one and holds a flock on it while it runs, released when its processes end however they end (exit, SIGKILL,
      # pod deleted). It never waits: Woodpecker runs two workflows at once (infra's WOODPECKER_MAX_WORKFLOWS) and each runs
      # its Gradle steps one after another, so a home is always free - the third for a cancelled build still dying in its
      # 20 s grace or an orphaned step pod. Every home taken is a fault, failed at once with its holders named. One Gradle
      # per home: Gradle's own locks are kernel locks too, but its request to a holder to release goes over loopback, which
      # no other pod shares. Never delete a home's *.lock files: a live Gradle holds them.
      - mkdir -p /cache/gradle/pool
      - 'home=""; for n in 1 2 3; do exec 9>>"/cache/gradle/pool/$n.flock"; if flock -n 9; then home=$n; break; fi; exec 9>&-; done'
      - '[ -n "$home" ] || { echo "every Gradle home in the pool is taken (three, for two workflows at once) - by: $(cat /cache/gradle/pool/*.holder 2>/dev/null | paste -sd ";")"; exit 1; }'
      - export GRADLE_USER_HOME=/cache/gradle/pool/$home
      - mkdir -p "$GRADLE_USER_HOME"
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > "/cache/gradle/pool/$home.holder"'
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the main analysis cannot run"; exit 1; }'
      - ./gradlew sonar --no-daemon -Dsonar.qualitygate.wait=false
    depends_on: [test]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  # ============== BUILD IMAGE (Kaniko) ==============
  - name: push-image
    image: gcr.io/kaniko-project/executor:debug
    commands:
      - mkdir -p /kaniko/.docker
      - |
        echo "{\"auths\":{\"git.pmon.dev\":{\"username\":\"$REGISTRY_USER\",\"password\":\"$REGISTRY_TOKEN\"}}}" > /kaniko/.docker/config.json
      - GIT_HASH=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - |
        /kaniko/executor \
          --context=. \
          --dockerfile=Dockerfile \
          --destination=git.pmon.dev/schnappy/chess:$GIT_HASH \
          --skip-tls-verify-registry=git.pmon.dev \
          --registry-mirror=nexus.pmon.dev:8082 \
          --insecure-registry=nexus.pmon.dev:8082 \
          --cache=true \
          --cache-repo=git.pmon.dev/schnappy/chess/cache
    depends_on: [test, sonar]
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: false, runAsUser: 0, runAsGroup: 0 }  # Kaniko builds as root - root only inside its user namespace
        secrets:
          - name: woodpecker-ci-secrets
            key: registry_user
            target:
              env: REGISTRY_USER
          - name: woodpecker-ci-secrets
            key: registry_token
            target:
              env: REGISTRY_TOKEN

  # ============== UPDATE INFRA REPO (Argo CD syncs) ==============
  - name: update-infra
    image: git.pmon.dev/schnappy/ci-tools:latest  # ci-deploy in it; its user ci (uid 1000)
    commands:
      - ci-deploy chess test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
        secrets:
          - name: woodpecker-ci-secrets
            key: infra_repo_token
            target:
              env: INFRA_TOKEN
    depends_on: [push-image]

services:
  - name: postgres
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: monitor_chess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70 }  # postgres's own user
  - name: valkey
    image: valkey/valkey:9.2-alpine
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000 }  # valkey's own user
