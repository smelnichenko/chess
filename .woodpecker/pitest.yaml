# Nightly mutation testing with Pitest
# Woodpecker cron: pitest-nightly, schedule: 30 3 * * * (UTC: 05:30 in Tallinn - after production's daily load test
# at 03:00 UTC, which it skewed when both started together; moved 2026-11-21), branch: main

when:
  - event: cron
    cron: pitest-nightly

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  - name: pitest
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    commands:
      # A Gradle home from a pool of three (/cache/gradle/pool/1, 2, 3), shared by every app's builds: the step takes the
      # first free one and holds a flock on it while it runs, released when its processes end however they end (exit, SIGKILL,
      # pod deleted). It never waits: Woodpecker runs two workflows at once (infra's WOODPECKER_MAX_WORKFLOWS) and each runs
      # its Gradle steps one after another, so a home is always free - the third for a cancelled build still dying in its
      # 20 s grace or an orphaned step pod. Every home taken is a fault, failed at once with its holders named. One Gradle
      # per home: Gradle's own locks are kernel locks too, but its request to a holder to release goes over loopback, which
      # no other pod shares. Never delete a home's *.lock files: a live Gradle holds them.
      - mkdir -p /cache/gradle/pool
      - 'home=""; for n in 1 2 3; do exec 9>>"/cache/gradle/pool/$n.flock"; if flock -n 9; then home=$n; break; fi; exec 9>&-; done'
      - '[ -n "$home" ] || { echo "every Gradle home in the pool is taken (three, for two workflows at once) - by: $(cat /cache/gradle/pool/*.holder 2>/dev/null | paste -sd ";")"; exit 1; }'
      - export GRADLE_USER_HOME=/cache/gradle/pool/$home
      - mkdir -p "$GRADLE_USER_HOME"
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > "/cache/gradle/pool/$home.holder"'
      - ./gradlew pitest --no-daemon
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        resources:
          requests: { memory: 2Gi }
          limits: { memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL
