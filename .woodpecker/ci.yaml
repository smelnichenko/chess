# CI: Run tests on push to non-main branches

# ONE run per change: the pull request's. Excluding main from the push trigger stopped the merge
# commit building twice, but every push to a branch that HAS an open PR still fired both pipelines -
# two identical runs of the same sha, racing for the same agent. Nothing lands here without a PR, so
# the PR run is the gate; deployment is untouched, cd.yaml still runs on push.
when:
  - event: pull_request

clone:
  - name: git
    image: woodpeckerci/plugin-git
    settings:
      home: /tmp  # non-root: its credentials file in a home it can write
      partial: false
      depth: 100
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }

steps:
  - name: test
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    depends_on: []
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/monitor_chess
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: test
      SPRING_DATA_REDIS_HOST: valkey
    commands:
      # A Gradle home from a pool of three (/cache/gradle/pool/1, 2, 3), shared by every app's builds: the step takes the
      # first free one and holds a flock on it while it runs, released when its processes end however they end (exit, SIGKILL,
      # pod deleted). It never waits: Woodpecker runs two workflows at once (infra's WOODPECKER_MAX_WORKFLOWS) and each runs
      # its Gradle steps one after another, so a home is always free - the third for a cancelled build still dying in its
      # 20 s grace or an orphaned step pod. Every home taken is a fault, failed at once with its holders named. One Gradle
      # per home: Gradle's own locks are kernel locks too, but its request to a holder to release goes over loopback, which
      # no other pod shares. Never delete a home's *.lock files: a live Gradle holds them.
      - mkdir -p /cache/gradle/pool
      - 'home=""; for n in 1 2 3; do exec 9>>"/cache/gradle/pool/$n.flock"; if flock -n 9; then home=$n; break; fi; exec 9>&-; done'
      - '[ -n "$home" ] || { echo "every Gradle home in the pool is taken (three, for two workflows at once) - by: $(cat /cache/gradle/pool/*.holder 2>/dev/null | paste -sd ";")"; exit 1; }'
      - export GRADLE_USER_HOME=/cache/gradle/pool/$home
      - mkdir -p "$GRADLE_USER_HOME"
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > "/cache/gradle/pool/$home.holder"'
      - ./gradlew check --no-daemon
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        resources:
          requests: { memory: 2Gi }
          limits: { memory: 4Gi }
        secrets:
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

  - name: sonar
    image: eclipse-temurin:25.0.5_8-jdk
    volumes:
      - ci-cache:/cache   # persistent dependency cache: PVC in infra clusters/production/woodpecker/manifests
    depends_on: [test]
    commands:
      # A Gradle home from a pool of three (/cache/gradle/pool/1, 2, 3), shared by every app's builds: the step takes the
      # first free one and holds a flock on it while it runs, released when its processes end however they end (exit, SIGKILL,
      # pod deleted). It never waits: Woodpecker runs two workflows at once (infra's WOODPECKER_MAX_WORKFLOWS) and each runs
      # its Gradle steps one after another, so a home is always free - the third for a cancelled build still dying in its
      # 20 s grace or an orphaned step pod. Every home taken is a fault, failed at once with its holders named. One Gradle
      # per home: Gradle's own locks are kernel locks too, but its request to a holder to release goes over loopback, which
      # no other pod shares. Never delete a home's *.lock files: a live Gradle holds them.
      - mkdir -p /cache/gradle/pool
      - 'home=""; for n in 1 2 3; do exec 9>>"/cache/gradle/pool/$n.flock"; if flock -n 9; then home=$n; break; fi; exec 9>&-; done'
      - '[ -n "$home" ] || { echo "every Gradle home in the pool is taken (three, for two workflows at once) - by: $(cat /cache/gradle/pool/*.holder 2>/dev/null | paste -sd ";")"; exit 1; }'
      - export GRADLE_USER_HOME=/cache/gradle/pool/$home
      - mkdir -p "$GRADLE_USER_HOME"
      - 'echo "$CI_REPO pipeline $CI_PIPELINE_NUMBER step $CI_STEP_NAME since $(date -u +%FT%TZ)" > "/cache/gradle/pool/$home.holder"'
      # Pull requests analyse into their OWN project (schnappy-chess-pr): SonarQube CE has no branch analysis, and pull
      # requests writing into schnappy-chess mixed main's record with every branch's - its dashboard showed whoever
      # pushed last (masi's split, 2026-09-20; this repo's 2026-11-16). cd.yaml analyses main into schnappy-chess.
      # A missing token fails the gate: one that skips itself green is a gate nobody enforces.
      - '[ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ] || { echo "SONAR_TOKEN or SONAR_HOST_URL is missing: the quality gate cannot be checked"; exit 1; }'
      - ./gradlew sonar --no-daemon -Dsonar.projectKey=schnappy-chess-pr -Dsonar.projectName='Schnappy Chess (pull requests)'
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }  # the image's own user (ubuntu)
        secrets:
          - name: woodpecker-ci-secrets
            key: sonar_token
            target:
              env: SONAR_TOKEN
          - name: woodpecker-ci-secrets
            key: sonar_host_url
            target:
              env: SONAR_HOST_URL
          - name: woodpecker-ci-secrets
            key: nexus_url
            target:
              env: NEXUS_URL

services:
  - name: postgres
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: monitor_chess
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 70, runAsGroup: 70 }  # postgres's own user
  - name: valkey
    image: valkey/valkey:9.2-alpine
    backend_options:
      kubernetes:
        securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000 }  # valkey's own user
